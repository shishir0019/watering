<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b7f5b">
<meta name="mobile-web-app-capable" content="yes">
<title>Watering</title>
<style>
:root {
  --bg: #f4f6f5; --card: #fff; --text: #1d2321; --muted: #66706c; --line: #dde3e0;
  --accent: #1b7f5b; --accent-text: #fff; --danger: #c0392b; --warn-bg: #fdecea; --warn: #a12a1e;
  --info-bg: #fff6e0; --info: #7a5300; --on: #1b7f5b; --wait: #b7791f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614; --card: #1c2220; --text: #e6ebe9; --muted: #9aa5a0; --line: #2c3431;
    --accent: #3fb68b; --accent-text: #08130e; --danger: #e5675a; --warn-bg: #3a1c19; --warn: #f3a59c;
    --info-bg: #362b12; --info: #f0cf86; --on: #3fb68b; --wait: #e2b155;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 12px 16px 80px; }
header { display: flex; align-items: center; gap: 8px; min-height: 48px; }
header h1 { flex: 1; font-size: 20px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; display: flex; align-items: center; justify-content: space-between; }
a { color: inherit; text-decoration: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
a.card { display: block; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.muted { color: var(--muted); font-size: 14px; }
.name { font-weight: 600; font-size: 17px; }
.pill { font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.on { background: var(--on); border-color: var(--on); color: var(--accent-text); }
.pill.wait { border-color: var(--wait); color: var(--wait); }
button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 10px 16px; min-height: 44px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--danger); border-color: var(--danger); }
button.icon { padding: 6px 12px; min-height: 40px; }
button:disabled { opacity: .45; cursor: default; }
input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
label { display: block; margin: 12px 0 4px; font-size: 14px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.dur { display: flex; align-items: center; gap: 8px; }
.dur input { width: 110px; }
.sched { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.sched:first-child { border-top: 0; }
.sched .info { flex: 1; cursor: pointer; }
.sched .time { font-weight: 600; font-size: 18px; }
.off .time, .off .muted { opacity: .5; }
.switch { position: relative; width: 48px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; min-height: 0; padding: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.days button { padding: 8px 0; min-height: 40px; font-size: 14px; }
.days button.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: flex; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.log li:first-child { border-top: 0; }
.log .t { color: var(--muted); white-space: nowrap; min-width: 92px; }
.banner { padding: 10px 16px; font-size: 14px; font-weight: 600; text-align: center; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.info { background: var(--info-bg); color: var(--info); }
.error { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 8px; }
.login { max-width: 360px; margin: 12vh auto 0; }
.login h1 { text-align: center; font-size: 22px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.modal { background: var(--card); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 16px 16px 24px; max-height: 92vh; overflow: auto; }
.modal h3 { margin: 0 0 4px; }
.actions { display: flex; gap: 8px; margin-top: 18px; }
.actions .spacer { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
</style>
</head>
<body>
<div id="banner"></div>
<main id="app"></main>
<div id="modal"></div>
<script>
'use strict';

const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const SOURCES = { schedule: 'schedule', manual: 'manual', catchup: 'catch-up', retry: 'retry' };
const POLL_MS = 3000;
const TIME_SYNC_MS = 10 * 60 * 1000;

const app = document.getElementById('app');
let pollTimer = null;
let sys = null;
let offline = false;
let lastTimeSync = 0;
let pumpNames = {};

// ---------------------------------------------------------------- helpers

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');

function hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

function fmtTime(t, withSeconds) {
  if (!t) return '—';
  const d = new Date(t * 1000);
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((day - today) / 86400000);
  const time = hm(d) + (withSeconds ? ':' + pad(d.getSeconds()) : '');
  if (diff === 0) return 'Today ' + time;
  if (diff === 1) return 'Tomorrow ' + time;
  if (diff === -1) return 'Yesterday ' + time;
  return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + time;
}

function fmtDur(s) {
  if (s < 60) return s + ' s';
  const m = Math.floor(s / 60), r = s % 60;
  return m + ' min' + (r ? ' ' + r + ' s' : '');
}

function fmtIn(t) {
  const s = Math.max(0, t - Math.floor(Date.now() / 1000));
  if (s < 60) return 'in < 1 min';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return 'in ' + (h ? h + 'h ' : '') + m + 'm';
}

function fmtMinute(v) { return pad(Math.floor(v / 60)) + ':' + pad(v % 60); }

function fmtDays(days) {
  const key = days.join(',');
  if (days.length === 7) return 'Every day';
  if (key === '1,2,3,4,5') return 'Mon–Fri';
  if (key === '6,7') return 'Weekends';
  return days.map(d => DAY_NAMES[d - 1]).join(', ');
}

function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return (d ? d + 'd ' : '') + (d || h ? h + 'h ' : '') + m + 'm';
}

function eventText(e, withPump) {
  const v = e.value;
  let text;
  switch (e.event) {
    case 'BOOT': text = 'Power restored'; break;
    case 'PUMP_START': text = 'Started (' + (SOURCES[e.source] || e.source) + ')'; break;
    case 'PUMP_END': text = 'Finished after ' + fmtDur(v); break;
    case 'PUMP_STOPPED': text = 'Stopped manually after ' + fmtDur(v); break;
    case 'SCHEDULE_SKIPPED': text = 'Schedule ' + fmtMinute(v) + ' skipped (already running)'; break;
    case 'MISSED': text = 'Schedule ' + fmtMinute(v) + ' missed (power off too long)'; break;
    case 'SCHEDULE_CHANGED': text = ['', 'Schedule added', 'Schedule edited', 'Schedule deleted'][v] || 'Schedule changed'; break;
    case 'PUMP_RENAMED': text = 'Renamed'; break;
    case 'LOGIN_OK': text = 'Logged in'; break;
    case 'LOGIN_FAIL': text = 'Wrong password entered'; break;
    case 'PASSWORD_CHANGED': text = 'Password changed'; break;
    case 'RTC_FAULT': text = v ? 'Clock time lost — schedules paused until synced' : 'Clock module not found — schedules paused until synced'; break;
    case 'TIME_SET': text = 'Clock synced' + (v ? ' (' + (v > 0 ? '+' : '−') + fmtDur(Math.abs(v)) + ')' : ''); break;
    default: text = e.event;
  }
  if (withPump && e.pump) text = (pumpNames[e.pump] || 'Pump ' + e.pump) + ': ' + text;
  return text;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ---------------------------------------------------------------- API

async function api(method, path, body) {
  const opts = { method, credentials: 'same-origin', headers: {} };
  if (method !== 'GET') {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body || {});
  }
  let res;
  try {
    res = await fetch(path, opts);
  } catch (e) {
    setOffline(true);
    throw new Error('Cannot reach the controller');
  }
  setOffline(false);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/api/login' && path !== '/api/password') {
    sys = null;
    renderBanner();
    go('#/login');
    throw new Error('Login required');
  }
  if (!res.ok) {
    const err = new Error(data.error || res.statusText);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function setOffline(v) {
  if (offline !== v) { offline = v; renderBanner(); }
}

async function refreshSystem() {
  sys = await api('GET', '/api/system');
  renderBanner();
  if (Date.now() - lastTimeSync > TIME_SYNC_MS) syncTime();
}

async function syncTime() {
  lastTimeSync = Date.now();
  try { await api('POST', '/api/time', { unix: Math.floor(Date.now() / 1000) }); } catch (e) { lastTimeSync = 0; }
}

function renderBanner() {
  const el = document.getElementById('banner');
  let html = '';
  if (offline) html = '<div class="banner warn">Offline — cannot reach the controller</div>';
  else if (sys && !sys.time_valid) html = '<div class="banner warn">Clock not set — schedules paused</div>';
  else if (sys && sys.default_password) html = '<div class="banner info">Please change the default password in <a href="#/settings"><u>Settings</u></a></div>';
  el.innerHTML = html;
}

// ---------------------------------------------------------------- routing

function go(hash) {
  if (location.hash === hash) route(); else location.hash = hash;
}

function poll(fn) {
  const run = () => fn().catch(() => {});
  run();
  pollTimer = setInterval(run, POLL_MS);
}

function route() {
  clearInterval(pollTimer);
  pollTimer = null;
  closeModal();
  const h = location.hash || '#/pumps';
  let m;
  if (h === '#/login') return viewLogin();
  if (h === '#/settings') return viewSettings();
  if ((m = h.match(/^#\/pump\/(\d+)$/))) return viewPump(+m[1]);
  return viewPumps();
}

window.addEventListener('hashchange', route);

// ---------------------------------------------------------------- login

function viewLogin() {
  document.getElementById('banner').innerHTML = '';
  app.innerHTML = `
    <form class="login card" id="login-form">
      <h1>Watering Controller</h1>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <button class="primary" style="width:100%;margin-top:16px" id="login-btn">Log in</button>
      <div class="error" id="login-err"></div>
    </form>`;
  const form = document.getElementById('login-form');
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-err');
    btn.disabled = true;
    err.textContent = '';
    try {
      await api('POST', '/api/login', { password: document.getElementById('pw').value });
      await syncTime();
      go('#/pumps');
    } catch (e) {
      if (e.status === 429) err.textContent = 'Too many attempts. Try again in ' + e.data.retry_after + ' s.';
      else if (e.status === 401) err.textContent = 'Wrong password (' + e.data.remaining + ' attempts left)';
      else err.textContent = e.message;
      btn.disabled = false;
    }
  });
}

// ---------------------------------------------------------------- pumps list

function statusPill(p) {
  if (p.running) return '<span class="pill on">● Running</span>';
  if (p.queued) return '<span class="pill wait">Waiting</span>';
  return '<span class="pill">Idle</span>';
}

function lastRunText(p) {
  if (!p.last_run) return 'Never run';
  return fmtTime(p.last_run.start) + ' (' + fmtDur(p.last_run.seconds) + ')';
}

function nextRunText(p) {
  return p.next_run ? fmtTime(p.next_run) + ' · ' + fmtIn(p.next_run) : 'No schedule';
}

function viewPumps() {
  app.innerHTML = `
    <header><h1>Pumps</h1><a class="btn" href="#/settings" aria-label="Settings">⚙</a></header>
    <div id="pumps"></div>`;
  poll(async () => {
    const [pumps] = await Promise.all([api('GET', '/api/pumps'), refreshSystem()]);
    pumps.forEach(p => { pumpNames[p.id] = p.name; });
    document.getElementById('pumps').innerHTML = pumps.map(p => `
      <a class="card" href="#/pump/${p.id}">
        <div class="row"><span class="name">${esc(p.name)}</span>${statusPill(p)}</div>
        ${p.running ? `<div class="muted">${p.remaining_s} s left (${SOURCES[p.source] || p.source})</div>` : ''}
        <div class="muted">Last: ${lastRunText(p)}</div>
        <div class="muted">Next: ${nextRunText(p)}</div>
      </a>`).join('');
  });
}

// ---------------------------------------------------------------- pump detail

function viewPump(id) {
  let pump = null;
  const min = sys ? sys.min_run_s : 5, max = sys ? sys.max_run_s : 600;
  app.innerHTML = `
    <header>
      <a class="btn icon" href="#/pumps" aria-label="Back">←</a>
      <h1 id="p-name">Pump ${id}</h1>
      <button class="icon" id="rename" aria-label="Rename">✎</button>
    </header>
    <div class="card" id="p-status"><div class="muted">Loading…</div></div>

    <h2>Manual</h2>
    <div class="card">
      <div class="dur">
        <label for="dur" style="margin:0">Duration</label>
        <input id="dur" type="number" inputmode="numeric" min="${min}" max="${max}" value="30">
        <span class="muted">seconds</span>
      </div>
      <div class="grid2">
        <button class="primary" id="start" disabled>Start</button>
        <button class="danger" id="stop" disabled>Stop</button>
      </div>
    </div>

    <h2>Schedules <button class="icon" id="add" aria-label="Add schedule">+ Add</button></h2>
    <div class="card" id="p-sched"></div>

    <h2>Log</h2>
    <div class="card"><ul class="log" id="p-log"></ul></div>`;

  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');

  function render() {
    const p = pump;
    pumpNames[p.id] = p.name;
    document.getElementById('p-name').textContent = p.name;
    document.getElementById('p-status').innerHTML = `
      <div class="row"><span>${statusPill(p)}</span>
        ${p.running ? `<span class="muted">${p.remaining_s} s left (${SOURCES[p.source] || p.source})</span>` : ''}</div>
      <div class="muted" style="margin-top:8px">Last run: ${lastRunText(p)}</div>
      <div class="muted">Next run: ${nextRunText(p)}</div>`;
    startBtn.disabled = p.running;
    stopBtn.disabled = !p.running && !p.queued;

    const list = document.getElementById('p-sched');
    if (!p.schedules.length) {
      list.innerHTML = '<div class="empty">No schedules. Tap “+ Add” to create one.</div>';
      return;
    }
    const sorted = [...p.schedules].sort((a, b) => a.time.localeCompare(b.time));
    list.innerHTML = sorted.map(s => `
      <div class="sched ${s.enabled ? '' : 'off'}">
        <div class="info" data-edit="${s.id}">
          <div class="time">${s.time}</div>
          <div class="muted">${fmtDur(s.seconds)} · ${fmtDays(s.days)}</div>
        </div>
        <label class="switch" aria-label="Enabled"><input type="checkbox" data-toggle="${s.id}" ${s.enabled ? 'checked' : ''}><span></span></label>
      </div>`).join('');
  }

  async function load() {
    const [p, log] = await Promise.all([
      api('GET', '/api/pumps/' + id),
      api('GET', '/api/logs?pump=' + id + '&limit=30'),
      refreshSystem(),
    ]);
    pump = p;
    render();
    document.getElementById('p-log').innerHTML = log.length
      ? log.map(e => `<li><span class="t">${fmtTime(e.time, true)}</span><span>${esc(eventText(e))}</span></li>`).join('')
      : '<li class="empty">No events yet</li>';
  }

  async function action(fn, btn) {
    if (btn) btn.disabled = true;
    try { await fn(); await load(); } catch (e) { toast(e.message); if (pump) render(); }
  }

  startBtn.onclick = () => action(async () => {
    const secs = parseInt(document.getElementById('dur').value, 10);
    if (!(secs >= min && secs <= max)) throw new Error('Duration must be ' + min + '–' + max + ' seconds');
    await api('POST', `/api/pumps/${id}/start`, { seconds: secs });
  }, startBtn);

  stopBtn.onclick = () => action(() => api('POST', `/api/pumps/${id}/stop`), stopBtn);

  document.getElementById('rename').onclick = () => {
    if (pump) renameForm(pump, () => action(() => Promise.resolve()));
  };

  document.getElementById('add').onclick = () => scheduleForm(id, null, () => action(() => Promise.resolve()));

  document.getElementById('p-sched').addEventListener('click', ev => {
    const edit = ev.target.closest('[data-edit]');
    if (edit && pump) {
      const s = pump.schedules.find(x => x.id === +edit.dataset.edit);
      if (s) scheduleForm(id, s, () => action(() => Promise.resolve()));
    }
  });

  document.getElementById('p-sched').addEventListener('change', ev => {
    const t = ev.target.closest('[data-toggle]');
    if (!t || !pump) return;
    const s = pump.schedules.find(x => x.id === +t.dataset.toggle);
    if (s) action(() => api('PUT', `/api/pumps/${id}/schedules/${s.id}`, { ...s, enabled: t.checked }));
  });

  poll(load);
}

// ---------------------------------------------------------------- modals

function openModal(html) {
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  m.firstChild.addEventListener('click', ev => { if (ev.target === m.firstChild) closeModal(); });
  return m.querySelector('.modal');
}

function closeModal() {
  document.getElementById('modal').innerHTML = '';
}

function scheduleForm(pumpId, s, onSaved) {
  const editing = !!s;
  const days = new Set(s ? s.days : [1, 2, 3, 4, 5, 6, 7]);
  const min = sys ? sys.min_run_s : 5, max = sys ? sys.max_run_s : 600;
  const m = openModal(`
    <h3>${editing ? 'Edit schedule' : 'Add schedule'}</h3>
    <form id="sf">
      <label for="sf-time">Start time</label>
      <input id="sf-time" type="time" required value="${s ? s.time : '06:00'}">
      <label for="sf-secs">Duration (seconds, ${min}–${max})</label>
      <input id="sf-secs" type="number" inputmode="numeric" required min="${min}" max="${max}" value="${s ? s.seconds : 30}">
      <label>Days</label>
      <div class="days" id="sf-days">
        ${DAY_NAMES.map((n, i) => `<button type="button" data-day="${i + 1}" class="${days.has(i + 1) ? 'sel' : ''}">${n.slice(0, 2)}</button>`).join('')}
      </div>
      <div class="row" style="margin-top:14px">
        <span>Enabled</span>
        <label class="switch"><input type="checkbox" id="sf-en" ${!s || s.enabled ? 'checked' : ''}><span></span></label>
      </div>
      <div class="error" id="sf-err"></div>
      <div class="actions">
        ${editing ? '<button type="button" class="danger" id="sf-del">Delete</button>' : ''}
        <span class="spacer"></span>
        <button type="button" id="sf-cancel">Cancel</button>
        <button class="primary" id="sf-save">Save</button>
      </div>
    </form>`);

  m.querySelector('#sf-days').addEventListener('click', ev => {
    const b = ev.target.closest('[data-day]');
    if (!b) return;
    const d = +b.dataset.day;
    if (days.has(d)) days.delete(d); else days.add(d);
    b.classList.toggle('sel', days.has(d));
  });
  m.querySelector('#sf-cancel').onclick = closeModal;

  const err = m.querySelector('#sf-err');
  async function submit(fn) {
    err.textContent = '';
    m.querySelectorAll('button').forEach(b => { b.disabled = true; });
    try { await fn(); closeModal(); onSaved(); } catch (e) {
      err.textContent = e.message;
      m.querySelectorAll('button').forEach(b => { b.disabled = false; });
    }
  }

  m.querySelector('#sf').addEventListener('submit', ev => {
    ev.preventDefault();
    const body = {
      time: m.querySelector('#sf-time').value,
      seconds: parseInt(m.querySelector('#sf-secs').value, 10),
      days: [...days].sort(),
      enabled: m.querySelector('#sf-en').checked,
    };
    if (!body.days.length) { err.textContent = 'Select at least one day'; return; }
    submit(() => editing
      ? api('PUT', `/api/pumps/${pumpId}/schedules/${s.id}`, body)
      : api('POST', `/api/pumps/${pumpId}/schedules`, body));
  });

  if (editing) {
    m.querySelector('#sf-del').onclick = () => {
      if (confirm('Delete the ' + s.time + ' schedule?')) {
        submit(() => api('DELETE', `/api/pumps/${pumpId}/schedules/${s.id}`));
      }
    };
  }
}

function renameForm(pump, onSaved) {
  const m = openModal(`
    <h3>Rename pump</h3>
    <form id="rf">
      <label for="rf-name">Name</label>
      <input id="rf-name" maxlength="31" required value="${esc(pump.name)}">
      <div class="error" id="rf-err"></div>
      <div class="actions"><span class="spacer"></span>
        <button type="button" id="rf-cancel">Cancel</button>
        <button class="primary">Save</button>
      </div>
    </form>`);
  m.querySelector('#rf-cancel').onclick = closeModal;
  m.querySelector('#rf').addEventListener('submit', async ev => {
    ev.preventDefault();
    try {
      await api('PATCH', '/api/pumps/' + pump.id, { name: m.querySelector('#rf-name').value.trim() });
      closeModal();
      onSaved();
    } catch (e) { m.querySelector('#rf-err').textContent = e.message; }
  });
}

// ---------------------------------------------------------------- settings

function viewSettings() {
  app.innerHTML = `
    <header><a class="btn icon" href="#/pumps" aria-label="Back">←</a><h1>Settings</h1></header>

    <h2>Change password</h2>
    <form class="card" id="pf">
      <label for="pf-cur">Current password</label>
      <input id="pf-cur" type="password" autocomplete="current-password" required>
      <label for="pf-new">New password (min 8 characters)</label>
      <input id="pf-new" type="password" autocomplete="new-password" minlength="8" maxlength="64" required>
      <label for="pf-rep">Repeat new password</label>
      <input id="pf-rep" type="password" autocomplete="new-password" required>
      <div class="error" id="pf-err"></div>
      <button class="primary" style="width:100%">Change password</button>
    </form>

    <h2>Controller</h2>
    <div class="card">
      <dl class="kv" id="sys"></dl>
      <div class="grid2"><button id="sync">Sync clock</button><button class="danger" id="logout">Log out</button></div>
    </div>

    <h2>System log</h2>
    <div class="card"><ul class="log" id="s-log"></ul></div>`;

  document.getElementById('pf').addEventListener('submit', async ev => {
    ev.preventDefault();
    const err = document.getElementById('pf-err');
    const cur = document.getElementById('pf-cur').value;
    const nw = document.getElementById('pf-new').value;
    err.textContent = '';
    if (nw !== document.getElementById('pf-rep').value) { err.textContent = 'New passwords do not match'; return; }
    try {
      await api('POST', '/api/password', { current: cur, new: nw });
      ev.target.reset();
      toast('Password changed. Other devices were logged out.');
      refreshSystem().catch(() => {});
    } catch (e) { err.textContent = e.message; }
  });

  document.getElementById('sync').onclick = async () => {
    lastTimeSync = 0;
    await syncTime();
    toast('Clock synced from this phone');
    load().catch(() => {});
  };

  document.getElementById('logout').onclick = async () => {
    try { await api('POST', '/api/logout'); } catch (e) { /* ignore */ }
    sys = null;
    go('#/login');
  };

  async function load() {
    const [log] = await Promise.all([api('GET', '/api/logs?limit=100'), refreshSystem()]);
    const wifi = sys.rssi ? sys.rssi + ' dBm' : '—';
    document.getElementById('sys').innerHTML = `
      <dt>Clock</dt><dd>${sys.time_valid ? fmtTime(sys.now, true) : '<b>Not set</b>'}</dd>
      <dt>Clock module</dt><dd>${sys.rtc_ok ? 'OK' : '<b>Not found</b>'}</dd>
      <dt>Uptime</dt><dd>${fmtUptime(sys.uptime_s)}${sys.settling ? ' (settling after power-on)' : ''}</dd>
      <dt>Wi-Fi signal</dt><dd>${wifi}</dd>
      <dt>Firmware</dt><dd>${esc(sys.version)}</dd>`;
    document.getElementById('s-log').innerHTML = log.length
      ? log.map(e => `<li><span class="t">${fmtTime(e.time, true)}</span><span>${esc(eventText(e, true))}</span></li>`).join('')
      : '<li class="empty">No events yet</li>';
  }
  poll(load);
}

route();
</script>
